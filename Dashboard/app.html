<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanisitech Onboarding</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>

  <!-- ── Simulation mode banner ────────────────────────── -->
  <div id="simBanner" class="sim-banner hidden">
    ⚠️ Simulation Mode Active — No real Microsoft 365 accounts are being created
  </div>

  <div class="layout">

    <!-- ── Sidebar ───────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">T</div>
        <div class="brand-text">
          <strong>Tanisitech</strong>
          <span>Onboarding</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <a href="#overview"      class="nav-item" data-page="overview">
          <span class="nav-icon">📊</span> Overview
        </a>
        <a href="#requests"      class="nav-item" data-page="requests">
          <span class="nav-icon">📋</span> Requests
        </a>
        <a href="#approvals"     class="nav-item nav-ph" data-page="approvals">
          <span class="nav-icon">✅</span> Approvals
          <span class="badge-count" id="pendingCount"></span>
        </a>
        <a href="#provisioning"  class="nav-item nav-ph" data-page="provisioning">
          <span class="nav-icon">⚙️</span> Provisioning
        </a>
        <a href="#audit"         class="nav-item nav-ph" data-page="audit">
          <span class="nav-icon">🔍</span> Audit Log
        </a>
        <a href="#settings"      class="nav-item nav-ph admin-only" data-page="settings">
          <span class="nav-icon">🔧</span> Settings
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-pill" id="userPill">
          <div class="avatar" id="userAvatar">?</div>
          <div class="user-info">
            <span id="userName">Loading…</span>
            <small id="userRole">—</small>
          </div>
        </div>
        <button class="logout-btn" id="logoutBtn" title="Sign out">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
            viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- ── Main content ───────────────────────────────────── -->
    <div class="main-wrap">

      <!-- Topbar -->
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="topbar-title" id="pageTitle">Overview</div>
        <div class="topbar-right">
          <button class="theme-toggle-btn" id="themeToggle" title="Toggle Light/Dark Theme">
            <span class="theme-icon-dark">🌙</span>
            <span class="theme-icon-light">☀️</span>
          </button>
          <span class="version-tag">v1.0.0</span>
        </div>
      </header>

      <!-- Page content area -->
      <main class="content" id="pageContent">
        <div class="loader-spinner center-spinner"></div>
      </main>

    </div>
  </div>

  <!-- ── Toast container ───────────────────────────────── -->
  <div id="toast-container"></div>

  <script type="module" src="./js/router.js"></script>
</body>
</html>
